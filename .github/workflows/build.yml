name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  # The Qt-free decoders compile and run with plain g++ on any machine,
  # which is the whole reason they are Qt-free. Only the ones that need no
  # fixture can run here: the golden-vector suites read real captures off
  # Jarno's own watch and account, and those deliberately are not in this
  # repository (see tests/README.md). So this job proves the code builds
  # and the fixture-free checks hold - it is not the full suite, and
  # nothing here should be read as if it were.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install zlib
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev

      - name: Run the fixture-free test suites
        working-directory: tests
        run: |
          set -e
          run() {
            name=$1; shift
            echo "== $name"
            g++ -std=c++17 -Wall -Wextra "$@" "test_$name.cpp" -o "/tmp/$name"
            "/tmp/$name"
          }
          run logentriesdecoder ../src/ble/logentriesdecoder.cpp
          run mdswirecodec      ../src/ble/mdswirecodec.cpp
          run notificationcodec ../src/ble/mdswirecodec.cpp ../src/ble/notificationcodec.cpp
          run notificationrouter ../src/ble/mdswirecodec.cpp ../src/ble/notificationcodec.cpp \
                                 ../src/notify/notificationrouter.cpp
          run polyline          ../src/cloud/polyline.cpp
          run vectortile        ../src/map/vectortile.cpp
          run mercator          ../src/map/mercator.cpp
          run capabilities      ../src/ble/capabilities.cpp
          run pluginregistry    ../src/ble/pluginregistry.cpp
          run workoutsummary    ../src/store/workoutsummary.cpp
          run suuntoauth        ../src/cloud/suuntoauth.cpp
          run zipwriter         ../src/cloud/zipwriter.cpp -lz
          # The FIT decoder's own tests live in harbour-edgesync, where it
          # was written; this one covers the units and the shape of the two
          # documents an imported workout is uploaded as.
          run fitencoder        -I ../src ../src/fit/fitencoder.cpp ../src/fit/activity.cpp \
                                 ../src/fit/fitdecoder.cpp ../src/fit/fitcrc.cpp
          # The vendored heatshrink is C and does not compile as C++ (its
          # malloc wrapper relies on the implicit void* conversion), so it
          # goes in as an object built by the C compiler. smljson.cpp drags
          # it in through the SBEM side it shares a translation unit with.
          gcc -c -O1 ../src/ble/heatshrink/heatshrink_decoder.c -o /tmp/heatshrink.o
          run fitsml            -I ../src ../src/cloud/smljson.cpp ../src/cloud/iso8601.cpp \
                                 ../src/ble/smldecoder.cpp ../src/ble/sbemcontainer.cpp \
                                 ../src/ble/sbemtable.cpp ../src/ble/sbemdescriptors.cpp \
                                 ../src/ble/sbemlayout.cpp ../src/fit/activity.cpp \
                                 ../src/fit/fitdecoder.cpp ../src/fit/fitcrc.cpp \
                                 ../src/fit/suuntosport.cpp \
                                 /tmp/heatshrink.o

      # Catches the class of mistake that produced a blank screen once: a
      # duplicate signal handler, which QML rejects at load time and which
      # no C++ build would ever notice.
      - name: Check the QML
        run: python3 tools/check_qml.py

      # The compiled-in descriptor table is generated, and a hand edit to
      # it would be silently overwritten the next time anyone regenerates.
      - name: Check the generated descriptor table is in sync
        run: |
          python3 tools/generate_sbem_tables.py
          git diff --exit-code -- src/ble/sbemdescriptors.h src/ble/sbemdescriptors.cpp

  rpm:
    needs: tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # aarch64 is what this is developed and tested on; armv7hl covers
        # the older devices and is built blind.
        arch: [aarch64, armv7hl]
    steps:
      - uses: actions/checkout@v4

      # **The daemon is built first, and the order matters.** The
      # application embeds the daemon's RPM so it can offer to install it
      # from Settings (see DAEMON_RPM in CMakeLists.txt), which means the
      # package has to exist before the application is configured. Built
      # second, as it was until this landed, the application would come out
      # silently without the installer - a build that succeeds and is
      # missing a feature, which is the worst shape for this to fail in.
      #
      # The action below cannot build it: its docker.sh runs a bare
      # `mb2 build` with no way to name a SPEC file. So the same image is
      # driven directly.
      #
      # The SPEC is swapped in rather than selected with a flag. mb2 picks
      # the one SPEC in rpm/, so putting the daemon's there and taking the
      # application's away is exactly as good as a flag and does not depend
      # on mb2 having one. It happens inside a throwaway copy in the
      # container; the checkout is untouched, which is why the daemon's SPEC
      # can stay out of rpm/ where sfdk and Qt Creator need it to be.
      - name: Build the daemon RPM
        run: |
          mkdir -p RPMS
          sudo chmod a+w RPMS
          docker run --rm --privileged \
            -v "$PWD:/workspace" \
            coderus/sailfishos-platform-sdk:5.1.0.11 \
            /bin/bash -euxc '
              mkdir -p /home/deploy/build && cd /home/deploy/build
              cp -r /workspace/* .
              rm -f rpm/*.spec
              cp daemon/suuntosync-notifyd.spec rpm/
              mb2 -t SailfishOS-5.1.0.11-${{ matrix.arch }} build
              cp RPMS/*.rpm /workspace/RPMS/
            '

      # Where CMakeLists.txt looks for it. One package per architecture, so
      # this is the matching one by construction - and the glob is checked
      # rather than trusted, because `cp` with a glob that matched nothing
      # would leave the application to build quietly without the installer.
      - name: Stage the daemon RPM for embedding
        run: |
          mkdir -p daemon/embed
          set -- RPMS/suuntosync-notifyd-*.rpm
          test -f "$1" || { echo "no daemon RPM to embed"; exit 1; }
          test $# -eq 1 || { echo "expected one daemon RPM, got $#: $*"; exit 1; }
          cp "$1" daemon/embed/suuntosync-notifyd.rpm
          ls -l daemon/embed/

      - name: Build the RPM
        uses: coderus/github-sfos-build@sfos5
        with:
          release: 5.1.0.11
          arch: ${{ matrix.arch }}

      # Proves the application really carries the package, rather than
      # trusting that the configure-time message appeared. An RPM's lead
      # magic is ed ab ee db, and the application's own binary is where it
      # has to be - not the one in daemon/embed/.
      - name: Check the daemon is embedded in the application
        run: |
          set -eu
          set -- RPMS/harbour-suuntosync-*.rpm
          test $# -eq 1 || { echo "expected one application RPM, got $#: $*"; exit 1; }
          # Unpacked whole rather than asking cpio for one member: whether
          # the archive spells the path "./usr/bin/..." or "/usr/bin/..."
          # varies, and a pattern that matches nothing exits 0 with an empty
          # file, which would pass a weaker check than this one.
          mkdir -p /tmp/appx
          ( cd /tmp/appx && rpm2cpio "$OLDPWD/$1" | cpio -idm --quiet )
          test -s /tmp/appx/usr/bin/harbour-suuntosync \
              || { echo "could not extract the binary"; exit 1; }
          cp /tmp/appx/usr/bin/harbour-suuntosync /tmp/app.bin
          python3 - <<'PY'
          import struct
          d = open('/tmp/app.bin', 'rb').read()
          i = d.find(b'\xed\xab\xee\xdb')
          assert i > 0, 'no RPM lead magic in the application binary'
          major, minor, typ, arch = struct.unpack('>BBhh', d[i + 4:i + 10])
          name = d[i + 10:i + 76].split(b'\x00')[0].decode()
          assert typ == 0, 'embedded RPM is not a binary package (type %d)' % typ
          assert name.startswith('suuntosync-notifyd'), 'embedded package is %s' % name
          print('embedded %s, rpm v%d.%d, archnum %d' % (name, major, minor, arch))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.arch }}
          path: RPMS/*.rpm
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: rpm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rpm-*
          merge-multiple: true
          path: rpms

      - uses: softprops/action-gh-release@v2
        with:
          files: rpms/*.rpm
          # Unsigned builds off a CI runner, not Store packages - say so
          # where somebody downloading them will see it.
          body: |
            Unsigned RPMs built by GitHub Actions for Sailfish OS 5.1.0.11,
            aarch64 and armv7hl.

            - `harbour-suuntosync` - the application. Sandboxed, and all of
              it works without the daemon below.
            - `suuntosync-notifyd` - optional. Forwards the phone's own
              notifications to the watch, which needs to run outside the
              Sailjail sandbox and is therefore a separate package. Install
              the application first; this one depends on it.

            Install with `devel-su pkcon install-local <file>.rpm`, which
            will warn that the package is untrusted. It is right: these are
            CI builds, not Store packages.
